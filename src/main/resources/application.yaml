spring:
    application:
        name: UserAPI
    datasource:
      url: ${POSTGRES_URL:jdbc:postgresql://localhost:5555/usersdb}
      username: ${POSTGRES_USER:admin}
      password: ${POSTGRES_PASSWORD:admin}
      driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: update
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true
      show-sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
    version: OPENAPI_3_1

userapi:
    basepath: https://randomuser.me/api/
    minimal: 0
    max: 1000